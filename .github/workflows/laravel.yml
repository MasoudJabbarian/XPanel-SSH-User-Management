name: Laravel

on:
  push:
    branches: [ "master", "fix/ubuntu-24-04-hardening" ]
  pull_request:
    branches: [ "master" ]

jobs:
  laravel-tests:

    runs-on: ubuntu-24.04

    steps:
    - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        php-version: '8.3'
    - uses: actions/checkout@v4
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"
    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
    - name: Generate key
      run: php artisan key:generate
    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache
    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite
    - name: Validate PHP syntax
      shell: bash
      run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

    - name: Validate Python proxy syntax
      run: python3 -m py_compile wss wssd

    - name: Validate shell scripts
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck
        bash -n install.sh ssl.sh ioncube.sh xp_user_limit.sh
        shellcheck install.sh ssl.sh ioncube.sh xp_user_limit.sh

    - name: Execute tests (Unit and Feature tests) via PHPUnit
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: vendor/bin/phpunit
